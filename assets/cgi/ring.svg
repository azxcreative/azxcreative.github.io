<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <defs>
    <radialGradient id="bg" cx="48%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0a2d6f"/>
      <stop offset="38%" stop-color="#06122b"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#29c8ff"/>
      <stop offset="34%" stop-color="#1367ff"/>
      <stop offset="52%" stop-color="#07101c"/>
      <stop offset="72%" stop-color="#7eb6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#cfeaff" stop-opacity=".9"/>
      <stop offset="28%" stop-color="#29c8ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <ellipse cx="450" cy="470" rx="250" ry="70" fill="#1367ff" opacity=".28" filter="url(#soft)"/>
  <circle cx="430" cy="360" r="210" fill="url(#core)" opacity=".7" filter="url(#soft)"/>
  <circle cx="450" cy="410" r="188" stroke="url(#chrome)" stroke-width="34" filter="url(#glow)"/>
  <circle cx="450" cy="410" r="118" stroke="#29c8ff" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="450" cy="410" r="78" stroke="#ffffff" stroke-opacity=".12" stroke-width=".6"/>
  <circle cx="390" cy="330" r="34" fill="#fff" opacity=".18" filter="url(#soft)"/>
  <path d="M210 410h480" stroke="#29c8ff" stroke-opacity=".18"/>
  <path d="M450 200v420" stroke="#1367ff" stroke-opacity=".12"/>
</svg>
